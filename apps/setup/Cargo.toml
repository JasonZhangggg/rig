[package]
name = "rig-setup"
version = "0.0.0"
description = "Rig's setup and uninstall window. Its version stays 0.0.0: the one it shows is the installer's inside it."
edition = "2021"
publish = false

# Its own workspace, so it builds apart from the desktop app.
[workspace]

[[bin]]
name = "rig-setup"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_System_Com",
] }

[build-dependencies]
tauri-winres = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
