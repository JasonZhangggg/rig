# Rig's website and API on Cloudflare Workers (free plan is enough to start).
# Setup steps are in docs/deploy.md.
name = "rig"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# The site's address. Custom domains need the domain's zone on this Cloudflare account.
# workers_dev stays on: installed apps up to 0.1.4 call the workers.dev address, and
# wrangler turns it off when routes are listed unless it's set.
routes = [
  { pattern = "rigpc.app", custom_domain = true },
  { pattern = "www.rigpc.app", custom_domain = true },
]
workers_dev = true

# The website's built files. /api/* goes to the Worker first, and so do the two pages,
# so a page opened at another address moves to WEB_ORIGIN. Everything else is a file.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/", "/index.html", "/app", "/app/*"]

# The Postgres database (Neon), reached through Hyperdrive. Replace the id
# with the one `wrangler hyperdrive create rig` prints. For local runs,
# wrangler dev connects straight to localConnectionString instead.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
localConnectionString = "postgres://rig:rig@localhost:5432/rig"

# Installers for the desktop app's updater, the latest three (see src/routes-updates.ts).
# The Deploy workflow creates the bucket; the Release workflow fills it.
[[r2_buckets]]
binding = "UPDATES"
bucket_name = "rig-updates"

[vars]
# The address people open. Change this to the real one before deploying.
WEB_ORIGIN = "http://localhost:8787"
CHAT_DAILY_LIMIT = "40"

# Secrets, set with `wrangler secret put NAME` (or in .dev.vars for local runs):
#   BETTER_AUTH_SECRET   required, a long random string
#   ANTHROPIC_API_KEY    for chat
#   CHAT_STATE_SECRET    for chat, a long random string; without it chat can't look at the PC live
#   GOOGLE_CLIENT_ID     optional, Google sign-in
#   GOOGLE_CLIENT_SECRET optional, Google sign-in
