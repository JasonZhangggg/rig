name: Probe auth
on:
  push:
    branches: [probe/auth-cpu]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in with an email that has no account (hashes a password, writes nothing)
        run: |
          base="${{ vars.RIG_API_URL }}"
          echo "base=$base"
          curl -sS -o ok.txt -w "auth/ok %{http_code} %{time_total}s\n" "$base/auth/ok"; cat ok.txt; echo
          for i in 1 2; do
            curl -sS -D h.txt -o b.txt -w "sign-in %{http_code} %{time_total}s\n" -X POST "$base/auth/sign-in/email" \
              -H "content-type: application/json" -H "origin: ${base%/api}" \
              --data '{"email":"nobody-probe@example.invalid","password":"not-a-real-password"}'
            grep -i "^cf-ray\|^content-type" h.txt; head -c 600 b.txt; echo
          done
