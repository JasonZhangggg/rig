name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Types, tests and builds that run anywhere. The main branch requires this
  # job by name, so keep it called "check". Its steps are in .github/actions/check.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check

  # The real thing: helper self-test on Windows and the installer.
  # Windows minutes count double on private repos, so this runs on main and
  # when started by hand (Actions tab > CI > Run workflow).
  # Release (release.yml) builds the installer with the same steps.
  windows:
    runs-on: windows-latest
    needs: check
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-installer
        id: build
        with:
          api-url: ${{ vars.RIG_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: rig-windows-installer
          path: ${{ steps.build.outputs.installer }}
