name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Types, tests and builds that run anywhere.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @rig/web build

      - name: Linux libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - run: pnpm --filter @rig/desktop build
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet build helper/RigHelper -c Release

  # The real thing: helper self-test on Windows and the installer.
  # Windows minutes count double on private repos, so this runs on main and
  # when started by hand (Actions tab > CI > Run workflow).
  windows:
    runs-on: windows-latest
    needs: check
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Build the helper
        run: dotnet publish helper/RigHelper -c Release -o helper-out
      - name: Helper self-test (reads parts, settings and sensors once)
        shell: pwsh
        run: |
          $p = Start-Process helper-out/RigHelper.exe -ArgumentList "--selftest", "selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "Helper self-test failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: helper-selftest, path: selftest.json, if-no-files-found: ignore }

      - name: Put the helper where Tauri bundles it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item helper-out/RigHelper.exe apps/desktop/src-tauri/binaries/RigHelper-x86_64-pc-windows-msvc.exe

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Build the installer
        run: pnpm --filter @rig/desktop tauri build
        env:
          VITE_RIG_API: ${{ vars.RIG_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: rig-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
