# Puts the website and server online on Cloudflare, with the database on Neon.
# Runs when the deploy branch is pushed, or by hand: Actions tab > Deploy > Run workflow.
# The secrets it needs are listed in docs/deploy.md.
name: Deploy

on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      web_origin:
        description: "The address people open. Leave empty for https://rigpc.app"
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Check the secrets are there
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL BETTER_AUTH_SECRET; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          [ -z "$missing" ] || { echo "::error::Add these repository secrets first:$missing"; exit 1; }

      # The site is at rigpc.app (the custom domains in wrangler.toml). The workers.dev
      # address keeps answering the API for installed apps, and its pages move to the site.
      - name: Work out the site address
        env:
          WEB_ORIGIN: ${{ inputs.web_origin || 'https://rigpc.app' }}
        run: |
          case "$WEB_ORIGIN" in https://*) ;; *) echo "::error::web_origin must start with https://"; exit 1;; esac
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty') || true
          [ -n "$sub" ] || { echo "::error::Couldn't read the account's workers.dev subdomain. Open Workers & Pages once in the Cloudflare dashboard to create one."; exit 1; }
          echo "WEB_ORIGIN=${WEB_ORIGIN%/}" >> "$GITHUB_ENV"
          echo "WORKERS_DEV=https://rig.$sub.workers.dev" >> "$GITHUB_ENV"
          echo "Site address: ${WEB_ORIGIN%/}"

      - name: Create or update the database tables
        run: pnpm --filter @rig/server db:migrate

      # Caching stays off. Hyperdrive would otherwise answer reads from a cache for up
      # to a minute, and sign-in needs fresh rows: the rate limiter retries until its
      # row reads back current, so a stale one held sign-in for a minute, and a code
      # claimed on the website still read as unclaimed when it was approved.
      - name: Connect Hyperdrive to the database
        working-directory: apps/server
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs"
          find_id() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result[] | select(.name == "rig") | .id' | head -1; }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler hyperdrive create rig --connection-string="$DATABASE_URL" --caching-disabled > /dev/null
            id=$(find_id)
          else
            npx wrangler hyperdrive update "$id" --connection-string="$DATABASE_URL" --caching-disabled > /dev/null
          fi
          [ -n "$id" ] || { echo "::error::Couldn't create the Hyperdrive config"; exit 1; }
          sed -i "s/^id = \".*\"/id = \"$id\"/" wrangler.toml
          echo "Hyperdrive config: $id"

      - name: Make the bucket the app updates from
        working-directory: apps/server
        run: |
          if npx wrangler r2 bucket info rig-updates > /dev/null 2>&1; then echo "rig-updates is there"; exit 0; fi
          npx wrangler r2 bucket create rig-updates || { echo "::error::Couldn't create the rig-updates R2 bucket. The CLOUDFLARE_API_TOKEN needs Workers R2 Storage: Edit, and R2 must be turned on in the Cloudflare dashboard (R2 Object Storage)."; exit 1; }

      - run: pnpm --filter @rig/web build

      # A new custom domain can take a few minutes to answer. Until it does, the Worker
      # runs with the workers.dev address as its site, so sign-in never points at an
      # address that isn't up yet.
      - name: Deploy the Worker
        working-directory: apps/server
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHAT_STATE_SECRET: ${{ secrets.CHAT_STATE_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        run: |
          secrets=$(mktemp)
          trap 'rm -f "$secrets"' EXIT
          jq -n 'env | {BETTER_AUTH_SECRET, ANTHROPIC_API_KEY, CHAT_STATE_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, BESTBUY_API_KEY} | with_entries(select(.value != null and .value != ""))' > "$secrets"
          deploy() { npx wrangler deploy --var "WEB_ORIGIN:$1" --secrets-file "$secrets"; }
          answers() { curl -fsS -o /dev/null --max-time 10 "$WEB_ORIGIN/api/config"; }
          if [ "$WEB_ORIGIN" != "$WORKERS_DEV" ] && ! answers; then
            deploy "$WORKERS_DEV"
            for i in $(seq 60); do answers && break; sleep 10; done
            answers || { echo "::error::$WEB_ORIGIN didn't answer within 10 minutes, so the site stays at $WORKERS_DEV. Check the domain under Workers & Pages > rig > Domains, then run Deploy again."; exit 1; }
          fi
          deploy "$WEB_ORIGIN"

      - name: Check it's up
        run: |
          sleep 5
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$WEB_ORIGIN/api/config"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$WORKERS_DEV/api/config"
          echo
          echo "Online at $WEB_ORIGIN, and installed apps still reach $WORKERS_DEV/api."
