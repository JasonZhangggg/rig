# Builds the helper, runs its self-test, bundles it into the Tauri app and
# builds the NSIS installer, then wraps that in Rig's own setup window
# (apps/setup). Runs on windows-latest after actions/checkout.
# Shared by CI and Release so both make the installer the same way.
name: Windows installer
description: The helper self-test and the Rig installer for Windows.
inputs:
  api-url:
    description: The Rig server the installed app signs in to, ending in /api (the RIG_API_URL repository variable).
    required: true
  updater-key:
    description: The updater's private key (the TAURI_SIGNING_PRIVATE_KEY secret). With it and apps/desktop/src-tauri/updater.pub, the app updates itself and the installer is signed for updates. Without it, the app doesn't update.
    required: false
  updater-key-password:
    description: The updater key's password, if it has one.
    required: false
outputs:
  setup:
    description: Path of Rig Setup (.exe), the setup people download. It shows Rig's own window and runs the installer inside it.
    value: ${{ steps.pack.outputs.setup }}
  installer:
    description: Path of the plain NSIS installer (.exe). Installed copies update with this one, quietly.
    value: ${{ steps.find.outputs.installer }}
  signature:
    description: Path of the installer's updater signature (.sig), empty when the build has no updater.
    value: ${{ steps.find.outputs.signature }}
runs:
  using: composite
  steps:
    - name: Check the server address is set
      shell: bash
      env:
        RIG_API_URL: ${{ inputs.api-url }}
      run: |
        if [ -z "$RIG_API_URL" ]; then
          echo "::error title=RIG_API_URL is not set::An installer built without the server's address can't sign in. In GitHub: Settings > Secrets and variables > Actions > Variables, add RIG_API_URL = <your Rig address>/api (see docs/deploy.md)."
          exit 1
        fi
        case "$RIG_API_URL" in
          https://*/api|http://*/api) echo "Installer will sign in to $RIG_API_URL" ;;
          *) echo "::error title=RIG_API_URL looks wrong::It should start with https:// and end in /api, like https://rig.example.com/api. It is $RIG_API_URL"; exit 1 ;;
        esac

    - uses: actions/setup-dotnet@v4
      with: { dotnet-version: 8.0.x }
    - name: Build the helper
      shell: pwsh
      run: dotnet publish helper/RigHelper -c Release -o helper-out
    - name: Helper self-test (reads parts, settings and sensors once)
      shell: pwsh
      run: |
        $p = Start-Process helper-out/RigHelper.exe -ArgumentList "--selftest", "selftest.json" -Wait -PassThru
        Get-Content selftest.json
        if ($p.ExitCode -ne 0) { throw "Helper self-test failed" }
    - uses: actions/upload-artifact@v4
      if: always()
      with: { name: helper-selftest, path: selftest.json, if-no-files-found: ignore, overwrite: true }

    - name: Put the helper where Tauri bundles it
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries | Out-Null
        Copy-Item helper-out/RigHelper.exe apps/desktop/src-tauri/binaries/RigHelper-x86_64-pc-windows-msvc.exe

    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with: { node-version: 22, cache: pnpm }
    - run: pnpm install --frozen-lockfile
      shell: pwsh
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          apps/desktop/src-tauri
          apps/setup
    - name: Fetch PawnIO, the driver for processor temperatures (pinned, hash-checked)
      shell: pwsh
      run: |
        node tools/pawnio.mjs
        $s = Get-AuthenticodeSignature apps/desktop/src-tauri/pawnio/PawnIO_setup.exe
        if ($s.Status -ne "Valid" -or $s.SignerCertificate.Subject -notmatch "O=namazso") { throw "PawnIO's signature is $($s.Status), signed by $($s.SignerCertificate.Subject)" }
        "Signed by $($s.SignerCertificate.Subject)"
    - name: Turn on updates when there's an updater key
      shell: bash
      env:
        RIG_API_URL: ${{ inputs.api-url }}
        KEY: ${{ inputs.updater-key }}
      run: |
        pub=apps/desktop/src-tauri/updater.pub
        if [ -z "$KEY" ]; then echo "No updater key, so this build won't update itself."; exit 0; fi
        [ -f "$pub" ] || { echo "::error::There's an updater key but no $pub. Commit the public key that goes with it (see docs/releasing.md)."; exit 1; }
        conf="$RUNNER_TEMP/updater.conf.json"
        jq -n --arg pubkey "$(tr -d '\r\n' < "$pub")" --arg url "$RIG_API_URL/updates/{{target}}/{{arch}}/{{current_version}}" \
          '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $pubkey, endpoints: [$url], windows: {installMode: "quiet"}}}}' > "$conf"
        echo "UPDATER_CONFIG=$conf" >> "$GITHUB_ENV"
        echo "This build updates from $RIG_API_URL/updates"
    - name: Build Rig's setup window (the installer copies it in as Rig's uninstaller)
      shell: pwsh
      run: |
        node tools/setup.mjs stub
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Build the installer
      shell: pwsh
      run: |
        if ($env:UPDATER_CONFIG) { pnpm --filter @rig/desktop tauri build --config $env:UPDATER_CONFIG }
        else { pnpm --filter @rig/desktop tauri build }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      env:
        VITE_RIG_API: ${{ inputs.api-url }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.updater-key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.updater-key-password }}

    - name: Find the installer
      id: find
      shell: bash
      run: |
        shopt -s nullglob
        files=(apps/desktop/src-tauri/target/release/bundle/nsis/*.exe)
        [ ${#files[@]} -eq 1 ] || { echo "::error::Expected one installer in bundle/nsis, found ${#files[@]}"; exit 1; }
        echo "Built ${files[0]}"
        echo "installer=${files[0]}" >> "$GITHUB_OUTPUT"
        if [ -n "$UPDATER_CONFIG" ]; then
          # Installed copies refuse an update signed with any other key, so check before it goes anywhere.
          node tools/updater-sig.mjs "${files[0]}" "${files[0]}.sig" apps/desktop/src-tauri/updater.pub
          echo "signature=${files[0]}.sig" >> "$GITHUB_OUTPUT"
        fi
    - name: Wrap the installer in Rig's setup window
      id: pack
      shell: bash
      run: |
        out=apps/desktop/src-tauri/target/release/bundle/setup/Rig-Setup.exe
        node tools/setup.mjs pack "${{ steps.find.outputs.installer }}" "$out"
        echo "setup=$out" >> "$GITHUB_OUTPUT"

    - name: Install with Rig Setup, check PawnIO and the helper, then uninstall
      shell: pwsh
      env:
        SETUP: ${{ steps.pack.outputs.setup }}
        INSTALLER: ${{ steps.find.outputs.installer }}
      run: |
        $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\PawnIO'
        $rig = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Rig'
        if (Test-Path $key) { throw "PawnIO is already on this runner, so the test can't tell who installed it" }
        # RIG_SETUP_AUTO presses Install in Rig's window and exits with the result.
        $env:RIG_SETUP_AUTO = "1"
        $p = Start-Process $env:SETUP -Wait -PassThru
        if ($p.ExitCode -ne 0) { throw "Rig Setup exited with $($p.ExitCode)" }
        $dir = Join-Path $env:LOCALAPPDATA "Rig"
        if (-not (Test-Path (Join-Path $dir "Rig.exe"))) { throw "Rig Setup didn't put Rig.exe in $dir" }
        $uninstall = (Get-ItemProperty $rig).UninstallString
        "Windows uninstalls Rig with: $uninstall"
        if ($uninstall -notmatch 'rig-setup\.exe" --uninstall$') { throw "Rig's uninstall entry doesn't open Rig's window" }
        if (Test-Path (Join-Path ([Environment]::GetFolderPath("Desktop")) "Rig.lnk")) { throw "Rig Setup made a desktop shortcut, though that's off unless someone turns it on" }
        if (-not (Test-Path (Join-Path $dir "pawnio\PawnIO_setup.exe"))) { throw "PawnIO's setup isn't in $dir" }
        if (-not (Test-Path $key)) { throw "Installing Rig didn't install PawnIO" }
        "PawnIO $((Get-ItemProperty $key).DisplayVersion) installed with Rig"
        if ((Get-ItemProperty 'HKLM:\SOFTWARE\Rig' -ErrorAction SilentlyContinue).PawnIOInstalledByRig -ne "1") { throw "Rig didn't record that it installed PawnIO" }
        $p = Start-Process (Join-Path $dir "RigHelper.exe") -ArgumentList "--selftest", "installed-selftest.json" -Wait -PassThru
        $driver = (Get-Content installed-selftest.json | ConvertFrom-Json).snapshot.driver
        "Helper sees PawnIO: installed=$($driver.installed) version=$($driver.version)"
        if (-not $driver.installed) { throw "The installed helper can't see PawnIO" }
        # Like Settings, Apps: the copy in Rig's folder hands over to one in the temp folder and exits.
        $p = Start-Process (Join-Path $dir "rig-setup.exe") -ArgumentList "--uninstall" -Wait -PassThru
        if ($p.ExitCode -ne 0) { throw "Rig's uninstall window exited with $($p.ExitCode)" }
        Start-Sleep -Seconds 1
        Wait-Process -Name rig-uninstall -Timeout 180 -ErrorAction SilentlyContinue
        if (Get-Process -Name rig-uninstall -ErrorAction SilentlyContinue) { throw "Rig's uninstall window was still open after 3 minutes" }
        if (Test-Path $key) { throw "Uninstalling Rig left PawnIO behind, though Rig installed it" }
        if (Test-Path $rig) { throw "Uninstalling Rig left its entry in Installed apps" }
        "Uninstalling Rig removed PawnIO"
        if (Test-Path $dir) { throw "Uninstalling Rig left $dir behind: $((Get-ChildItem -Recurse $dir | Select-Object -ExpandProperty FullName) -join ', ')" }

        # Scripts and IT tools still get the plain flags: /S installs with no window.
        Remove-Item Env:RIG_SETUP_AUTO
        $p = Start-Process $env:SETUP -ArgumentList "/S" -Wait -PassThru
        if ($p.ExitCode -ne 0) { throw "Rig Setup /S exited with $($p.ExitCode)" }
        if (-not (Test-Path (Join-Path $dir "Rig.exe"))) { throw "Rig Setup /S didn't install Rig" }
        $p = Start-Process (Join-Path $dir "uninstall.exe") -ArgumentList "/S", "_?=$dir" -Wait -PassThru
        if ($p.ExitCode -ne 0) { throw "Uninstaller exited with $($p.ExitCode)" }
        "Rig Setup /S and uninstall.exe /S work too"
